name: Delete old package versions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted and delete nothing
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: [self-hosted, Linux, X64, studio-linux]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      PLAN: |
          {
            "charts": {
              "keep": "1.1.0",
              "delete": [
                "2.0.0"
              ]
            },
            "tasks": {
              "keep": "1.2.2",
              "delete": [
                "0.3.0",
                "0.4.0",
                "0.5.0",
                "0.5.1",
                "0.5.2"
              ]
            },
            "rich-editor": {
              "keep": "1.0.1",
              "delete": [
                "0.1.0",
                "0.1.1"
              ]
            }
          }
    steps:
      - name: Delete the listed versions
        run: |
          set -euo pipefail
          for pkg in $(jq -r 'keys[]' <<<"$PLAN"); do
            keep="$(jq -r --arg p "$pkg" '.[$p].keep' <<<"$PLAN")"
            listing="$(gh api --paginate "/users/heyramzi/packages/npm/$pkg/versions?per_page=100" --jq '.[] | [.id, .name] | @tsv')"
            echo "== $pkg: keep $keep, $(wc -l <<<"$listing") versions on the registry"
            if [ -z "$(awk -F'\t' -v v="$keep" '$2 == v { print $1 }' <<<"$listing")" ]; then echo "ERROR $pkg: current version $keep is missing from the registry" >&2; exit 1; fi
            while IFS= read -r ver; do
              if [ "$ver" = "$keep" ]; then echo "ERROR $pkg: the list names the current version $keep" >&2; exit 1; fi
              vid="$(awk -F'\t' -v v="$ver" '$2 == v { print $1 }' <<<"$listing")"
              if [ -z "$vid" ]; then echo "$pkg@$ver: not on the registry, skipped"; continue; fi
              if [ "$DRY_RUN" = "true" ]; then echo "$pkg@$ver: would delete id $vid"; continue; fi
              if gh api -X DELETE "/users/heyramzi/packages/npm/$pkg/versions/$vid" >/dev/null; then
                echo "$pkg@$ver: deleted id $vid"
              else
                echo "ERROR failed call: DELETE /users/heyramzi/packages/npm/$pkg/versions/$vid ($pkg@$ver)" >&2
                exit 1
              fi
            done < <(jq -r --arg p "$pkg" '.[$p].delete[]' <<<"$PLAN")
          done
