packages:
  - site
  - packages/*
overrides:
  cookie@<0.7.0: ">=0.7.2 <1"
  fflate@>=0.7.0 <0.7.5: ">=0.8.3 <1"
  sharp@<0.35.5: ">=0.35.5 <1"
  vite@*: 'catalog:'
packageExtensions:
  svelte-check@4:
    dependencies:
      typescript: ^6.0.3
# WHY: pnpm 12 fails the install (ERR_PNPM_IGNORED_BUILDS) when a dependency has an
# unreviewed build script. esbuild and workerd fetch or link their native binary in
# postinstall, so they have to run.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@heyramzi/*'
  - tsrs@7.1.0-beta.tsrs2
  - '@tsrs/darwin-arm64@7.1.0-beta.tsrs2'
  - '@tsrs/darwin-x64@7.1.0-beta.tsrs2'
  - '@tsrs/linux-x64-gnu@7.1.0-beta.tsrs2'
  - '@tsrs/linux-x64-musl@7.1.0-beta.tsrs2'
  - '@tsrs/linux-arm64-gnu@7.1.0-beta.tsrs2'
  - '@tsrs/linux-arm64-musl@7.1.0-beta.tsrs2'
  - '@tsrs/win32-x64@7.1.0-beta.tsrs2'
  - '@tsrs/win32-arm64@7.1.0-beta.tsrs2'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
